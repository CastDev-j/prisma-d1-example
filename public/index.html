<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Hello, World!</title>

	<style>
		body {
			font-family: Arial, sans-serif;
			padding: 20px;
		}

		h1 {
			color: #333;
		}

		.user-list {
			list-style-type: none;
			padding: 0;
		}

		.user-list li {
			background-color: #f9f9f9;
			margin: 5px 0;
			padding: 10px;
			border-radius: 4px;
			border: 1px solid #ddd;
		}

		.user-list.loading::before {
			content: 'Cargando usuarios...';
			display: block;
			font-style: italic;
			color: #888;
			margin-bottom: 10px;
		}
	</style>
</head>

<body>
	<h1>Lista de usuarios</h1>
	<ul class="user-list loading"></ul>

	<script>
		fetch('/api/users')
			.then((resp) => resp.json())
			.then((users) => {
				const userList = document.querySelector('.user-list');
				let userCollection = document.createDocumentFragment();
				users.forEach((user) => {
					const li = document.createElement('li');
					li.textContent = `${user.name} (${user.email})`;
					userCollection.appendChild(li);
				});
				userList.appendChild(userCollection);
				userList.classList.remove('loading');
			});
	</script>
</body>

</html>
